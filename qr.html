<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scan me — Anthrolytic landing</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(160deg, #f6f3ff 0%, #ffffff 60%);
    color: #111114;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: #fff;
    border: 1px solid #ececef;
    border-radius: 28px;
    padding: 28px 28px 24px;
    box-shadow: 0 30px 60px -30px rgba(74, 30, 130, 0.35);
    text-align: center;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 6px;
    font-weight: 800;
    letter-spacing: -0.015em;
  }
  p.sub {
    font-size: 14px;
    color: #6b6b75;
    margin: 0 0 22px;
  }
  .qr-wrap {
    background: #fff;
    border: 1px solid #ececef;
    border-radius: 18px;
    padding: 16px;
    display: inline-block;
    margin-bottom: 18px;
  }
  .qr-wrap img {
    display: block;
    width: 280px;
    height: 280px;
    image-rendering: pixelated;
  }
  .meta {
    font-size: 12px;
    color: #8a8a93;
    margin: 0 0 16px;
  }
  .open-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(135deg, #8a3df0 0%, #6f2dd8 100%);
    color: #fff;
    text-decoration: none;
    padding: 12px 20px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14.5px;
    box-shadow: 0 14px 26px -14px rgba(138, 61, 240, 0.7);
  }
  .hint {
    font-size: 12px;
    color: #8a8a93;
    margin-top: 14px;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Scan with your phone</h1>
  <p class="sub">Point your camera at the code to open the landing page.</p>
  <div class="qr-wrap">
    <img alt="QR code" src="https://api.qrserver.com/v1/create-qr-code/?size=560x560&margin=10&data=https%3A%2F%2F019df19e-8f15-729d-94be-8527dc03a2bf.claudeusercontent.com%2Fv1%2Fdesign%2Fprojects%2F019df19e-8f15-729d-94be-8527dc03a2bf%2Fserve%2FAnthrolytic%2520Landing.html%3Ft%3D837c948e94fd387eae962c902df81b67e9961f744f287ba0df6132c23a66ca89.3efcc453-659e-475c-8a0c-5165a6e75c35.9b89d8c0-a02a-4f1f-92ef-b87f5c8db5be.1777883454" />
  </div>
  <p class="meta">Link expires in about an hour</p>
  <a class="open-btn" href="https://019df19e-8f15-729d-94be-8527dc03a2bf.claudeusercontent.com/v1/design/projects/019df19e-8f15-729d-94be-8527dc03a2bf/serve/Anthrolytic%20Landing.html?t=837c948e94fd387eae962c902df81b67e9961f744f287ba0df6132c23a66ca89.3efcc453-659e-475c-8a0c-5165a6e75c35.9b89d8c0-a02a-4f1f-92ef-b87f5c8db5be.1777883454" target="_blank" rel="noopener">Or tap to open</a>
  <p class="hint">If the QR doesn't render, use the button — both go to the same place.</p>
</div>
</body>
</html>
